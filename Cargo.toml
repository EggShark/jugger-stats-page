[package]
name = "jugger-stats"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
axum = {version = "0.8.9", features = ["json"]}
bcrypt = "0.19.3"
rusty_paseto = "0.10.1"
serde = "1.0.229"
sqlx = {version = "0.9.0", features=["postgres", "runtime-tokio"]}
tokio = {version = "1.53.2", features = ["macros","rt-multi-thread"]}
tower-http = {version = "0.7.1", features = ["fs"]}
