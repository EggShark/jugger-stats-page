<!DOCTYPE html>
<html lang="en">
<head>
    <!-- test -->
    <meta charset="UTF-8"> <!-- test -->
    <!-- test
    mutliline
    -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bottomless-Site</title>
    <link rel="stylesheet" href="css/data_add.css">
    <style>
        body {
            height: 100%;
        }
    </style>
    <script src="/js/add_player.js" defer></script>
</head>
<body>
<div class="data-bar-div">
		<button class="data-bar-button">Players</button>
		<button class="data-bar-button">Teams</button>
		<button class="data-bar-button">Events</button>
		<button class="data-bar-button">Leauge Registrations</button>
</div>
<div class="data-area">
	<div class="specific-area player-area-div">
		<div class="area-title-div">
			<h2>Manage Players</h2>
		</div>
		<div class="area-content-div">
			<div class="player-form">
				<h3>Add Player</h3>
				<form autocomplete="off" id="add-player-form">
					<label>Player Name:</label>
					<input type="text" placeholder="Firstname Lastname" id="form-player-name" name="form-player-name" required>
					<input type="checkbox" name="add-to-team-check" id="add-to-team-check">
					<h3> add to team </h3>
					<label>Team name:</label>
					<input type="text" placeholder="team name" id="form-team-name" name="form-team-name">
					<br>
					<label>Jersey Number</label>
					<input type="text" placeholder="Jersey Number" id="form-jersey-number" name="form-jersey-number">
					<label>Jersey Name</label>
					<input type="text" placeholder="Jersey Name" id="form-jersey-name" name="form-jersey-name">
					<br>
					<input type="submit" value="Add Player">
				</form>
			</div>
			<div class="player-list-area">
				<h3> Player List </h3>
				<input placeholder="Search a players name">
				<div class="player-results-area">
					<table class="data-table">
						<thead class="data-table-head">
							<tr class="data-table-head">
								<th>
									Name
								</th>
								<th>
									Player id
								</th>
								<th>
									Most recent team
								</th>
								<th>
									Remove player
								</th>
							</tr>
						</thead>
						<tbody>
							<tr class="data-table-entry">
								<td>
									Charlotte
								</td>
								<td>
									123
								</td>
								<td>
									Canaries
								</td>
								<td>
									<button>Delete</button>
								</td>
							</tr>

						</tbody>
					</table>
				</div>
			</div>
		</div>
	</div>
	<div class="team-area-div hidden">
		<p> hi im the team area </p>
	</div>
	<div class="event-area-div hidden">
		<p> hi im the event area div </p>
	</div>
	<div class="registration-area-div hidden">
		<p> hi im the registration area div </p>
	</div>
</div>
</body>
</html>
