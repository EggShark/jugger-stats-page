<!DOCTYPE html>
<html lang="en">
<head>
    <!-- test -->
    <meta charset="UTF-8"> <!-- test -->
    <!-- test
    mutliline
    -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bottomless-Site</title>
    <link rel="stylesheet" href="css/data_add.css">
    <style>
        body {
            height: 100%;
        }
    </style>
</head>
<body>
<div class="data-bar-div">
		<button class="data-bar-button">Players</button>
		<button class="data-bar-button">Teams</button>
		<button class="data-bar-button">Events</button>
		<button class="data-bar-button">Leauge Registrations</button>
</div>
<div class="data-area">
	<div class="specific-area player-area-div">
		<div class="area-title-div">
			<h2>Manage Players</h2>
		</div>
		<div class="area-content-div">
			<div class="player-form">
				<h3>Add Player</h3>
				<form autocomplete="off">
					<label>Player Name:</label>
					<input type="text" placeholder="Firstname Lastname" required>
					<h3> add to team </h3>
					<label>Team name:</label>
					<input type="text" placeholder="team name">
					<br>
					<label>Jersey Number</label>
					<input type="text" placeholder="Jersey Number">
					<label>Jersey Name</label>
					<input type="text" placeholder="Jersey Name">
					<br>
					<input type="submit" value="Add Player">
				</form>
			</div>
			<div class="player-list-area">
				<h3> Player List </h3>
				<input>
				<div class="player-results-area">
					<div class="player-results-header">
						<p>Name</p>
						<p>player id</p>
						<p>Most Recent Team</p>
					</div>
					<div class="player-results-list-div">
						<ul class="player-results-list">
							<li class="player-result-item">
								<p> name </p>
								<p> 123 </p>
								<p> canaries </p>
								<button>delete player</button>
							</li>
						</ul>
					</div>
				</div>
			</div>
		</div>
	</div>
	<div class="team-area-div hidden">
		<p> hi im the team area </p>
	</div>
	<div class="event-area-div hidden">
		<p> hi im the event area div </p>
	</div>
	<div class="registration-area-div hidden">
		<p> hi im the registration area div </p>
	</div>
</div>
</body>
</html>
